services:
  - type: web
    name: consentx
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /healthz
    envVars:
      - key: CONSENTX_SECRET_KEY
        generateValue: true
      - key: CONSENTX_OPERATOR_TOKEN
        generateValue: true
