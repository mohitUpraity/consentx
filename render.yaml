services:
  - type: web
    name: consentx
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /api/health
    disk:
      name: consentx-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CONSENTX_DB
        value: /var/data/consentx.sqlite3
      - key: CONSENTX_SECRET_KEY
        generateValue: true
      - key: CONSENTX_OPERATOR_TOKEN
        generateValue: true
